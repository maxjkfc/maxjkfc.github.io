<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mermaid 即時預覽 — Dev Tools</title>
<meta name="description" content="在瀏覽器即時編輯並預覽 Mermaid 流程圖，支援匯出 SVG。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧜</text></svg>">
<link rel="stylesheet" href="./style.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  main { flex: 1; display: grid; grid-template-columns: minmax(280px, 40%) 1fr; min-height: 0; }
  #src {
    font-family: var(--font-mono); font-size: 13px; line-height: 1.6;
    border: 0; border-right: 1px solid var(--line); resize: none; padding: 16px;
    background: var(--panel); color: var(--ink); outline: none; tab-size: 2;
  }
  #view { overflow: auto; padding: 16px; display: flex; align-items: flex-start; justify-content: center; }
  #view svg { max-width: 100%; height: auto; }
  #err { display: none; margin: 0; padding: 10px 16px; border-top: 1px solid var(--line);
         background: var(--panel); color: var(--danger); font-family: var(--font-mono);
         font-size: 12px; white-space: pre-wrap; max-height: 30vh; overflow: auto; }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; }
    #src { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header class="bar">
  <h1>Mermaid 即時預覽</h1>
  <select id="sample" title="範例"></select>
  <select id="theme" title="主題">
    <option value="default">default</option>
    <option value="dark">dark</option>
    <option value="neutral">neutral</option>
    <option value="forest">forest</option>
  </select>
  <button id="svg">下載 SVG</button>
  <button id="png">下載 PNG</button>
  <span class="spacer"></span>
  <span id="status" class="status">—</span>
  <a href="./">全部工具</a>
</header>
<main>
  <textarea id="src" spellcheck="false" placeholder="在這裡輸入 Mermaid 語法…"></textarea>
  <div id="view"></div>
</main>
<pre id="err"></pre>

<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

const SAMPLES = {
  'flowchart': `flowchart TD
  A[使用者送出請求] --> B{已登入?}
  B -- 否 --> C[導向登入頁]
  B -- 是 --> D[查詢資料]
  D --> E[回傳結果]`,
  'sequence': `sequenceDiagram
  participant U as User
  participant API
  participant DB
  U->>API: POST /orders
  API->>DB: INSERT order
  DB-->>API: order_id
  API-->>U: 201 Created`,
  'state': `stateDiagram-v2
  [*] --> Pending
  Pending --> Active: approve
  Pending --> Rejected: reject
  Active --> Closed: finish
  Closed --> [*]`,
  'er': `erDiagram
  CUSTOMER ||--o{ ORDER : places
  ORDER ||--|{ ORDER_ITEM : contains
  PRODUCT ||--o{ ORDER_ITEM : "listed in"`,
  'gantt': `gantt
  title 專案排程
  dateFormat YYYY-MM-DD
  section 設計
  需求確認 :done, a1, 2026-07-01, 5d
  介面設計 :active, a2, after a1, 7d
  section 開發
  實作 :a3, after a2, 14d`,
};

const $ = id => document.getElementById(id);
const src = $('src'), view = $('view'), err = $('err'), status = $('status');

for (const k of Object.keys(SAMPLES)) $('sample').add(new Option(k, k));

const saved = localStorage.getItem('mermaid.src');
src.value = saved ?? SAMPLES.flowchart;
$('theme').value = localStorage.getItem('mermaid.theme')
  ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default');

let seq = 0;
async function render() {
  const code = src.value.trim();
  localStorage.setItem('mermaid.src', src.value);
  if (!code) { view.innerHTML = ''; ok('空白'); return; }
  // htmlLabels:false → 標籤用 <text> 而非 <foreignObject>，PNG 匯出才不會掉字
  mermaid.initialize({ startOnLoad: false, theme: $('theme').value, securityLevel: 'strict', htmlLabels: false, flowchart: { htmlLabels: false } });
  try {
    const { svg } = await mermaid.render('g' + (++seq), code);
    view.innerHTML = svg;
    ok(`已更新 · ${code.split('\n').length} 行`);
  } catch (e) {
    // ponytail: 出錯時保留上一張圖，只在下方顯示訊息
    fail(e.message ?? String(e));
  }
}
function ok(msg) { status.textContent = msg; status.classList.remove('error'); err.style.display = 'none'; }
function fail(msg) { status.textContent = '語法錯誤'; status.classList.add('error'); err.textContent = msg; err.style.display = 'block'; }

let timer;
src.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 250); });
$('theme').addEventListener('change', () => { localStorage.setItem('mermaid.theme', $('theme').value); render(); });
$('sample').addEventListener('change', e => { src.value = SAMPLES[e.target.value]; render(); });

// Tab 鍵插入兩個空白，而不是跳離 textarea
src.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  e.preventDefault();
  const { selectionStart: s, selectionEnd: t } = src;
  src.setRangeText('  ', s, t, 'end');
});

function currentSvg() {
  const el = view.querySelector('svg');
  if (!el) { fail('目前沒有可匯出的圖'); return null; }
  return el;
}
function download(blob, name) {
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
  a.click();
  URL.revokeObjectURL(a.href);
}
$('svg').addEventListener('click', () => {
  const el = currentSvg();
  if (el) download(new Blob([el.outerHTML], { type: 'image/svg+xml' }), 'diagram.svg');
});
$('png').addEventListener('click', () => {
  const el = currentSvg();
  if (!el) return;
  const box = el.getBoundingClientRect();
  const img = new Image();
  img.onload = () => {
    const c = Object.assign(document.createElement('canvas'), { width: box.width * 2, height: box.height * 2 });
    const ctx = c.getContext('2d');
    ctx.fillStyle = getComputedStyle(document.body).backgroundColor;
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => download(b, 'diagram.png'));
  };
  img.onerror = () => fail('PNG 轉檔失敗，請改用 SVG');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(el.outerHTML);
});

render();
</script>
</body>
</html>
